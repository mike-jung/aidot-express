<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>서버 시작 실패</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#dfe3ea;--text:#1a1f2b;--dim:#6b7280;--bad:#c0392b;--accent:#185FA5}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1420;--card:#161c2a;--line:#262e40;--text:#e6e9f0;--dim:#9aa1b2}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);display:flex;flex-direction:column;
  font:13.5px/1.5 -apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;padding:18px 20px;gap:12px}
h1{font-size:16px;margin:0;color:var(--bad);display:flex;align-items:center;gap:8px}
h1::before{content:"✕";display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;background:var(--bad);color:#fff;font-size:13px}
.why{color:var(--text);font-size:13.5px}
.paths{color:var(--dim);font-size:12px;line-height:1.7}
.paths b{color:var(--text);font-weight:600}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.k{color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
pre{flex:1;min-height:0;overflow:auto;margin:0;padding:12px 14px;background:var(--card);
  border:1px solid var(--line);border-radius:10px;
  font:12px/1.55 ui-monospace,Consolas,"D2Coding",monospace;white-space:pre;tab-size:2}
.actions{display:flex;gap:8px;align-items:center}
button{padding:8px 14px;border-radius:8px;border:1px solid var(--line);
  background:var(--card);color:var(--text);font-size:13px;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;gap:6px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:hover{filter:brightness(.97)}
.spacer{flex:1}
#copied{color:var(--dim);font-size:12px;opacity:0;transition:opacity .15s}
#copied.on{opacity:1}
</style>
</head>
<body>
<h1>서버를 시작하지 못했습니다</h1>
<div class="why" id="why">—</div>

<div class="paths" id="paths"></div>

<div class="head">
  <span class="k">서버가 남긴 메시지</span>
  <span id="copied">복사했습니다</span>
</div>
<pre id="out">(출력이 없습니다)</pre>

<div class="actions">
  <button id="copy" title="전체를 클립보드로">
    <!-- 두 장 겹친 문서 모양 — 복사를 뜻하는 흔한 그림 -->
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
      <rect x="5.2" y="5.2" width="8.3" height="9.3" rx="1.4"/>
      <path d="M10.8 5.2V2.9a1.4 1.4 0 0 0-1.4-1.4H3.9A1.4 1.4 0 0 0 2.5 2.9v6.5a1.4 1.4 0 0 0 1.4 1.4h1.3"/>
    </svg>
    오류 복사
  </button>
  <button id="openLog">로그 폴더 열기</button>
  <button id="openEnv">설정 파일 열기</button>
  <div class="spacer"></div>
  <button id="quit" class="primary">종료</button>
</div>

<script>
let payload = { reason: '', output: [], envPath: '', logPath: '', version: '', node: '' };

window.errorDialog.onData((d) => {
  payload = { ...payload, ...d };
  document.getElementById('why').textContent = payload.reason || '알 수 없는 이유로 종료되었습니다.';
  document.getElementById('paths').innerHTML =
    `<b>설정</b> ${esc(payload.envPath || '—')}<br><b>로그</b> ${esc(payload.logPath || '—')}`;
  const text = (payload.output || []).join('\n');
  document.getElementById('out').textContent = text || '(출력이 없습니다)';
  /* 스택은 아래쪽이 중요하다 — 처음부터 끝을 보여 준다 */
  const pre = document.getElementById('out');
  pre.scrollTop = pre.scrollHeight;
});

const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]));

/** 붙여넣기 좋게 — 버전·환경까지 함께 담는다. 받는 사람이 되물을 일이 줄어든다. */
function fullText() {
  return [
    `Aidot Express ${payload.version || ''} · Node ${payload.node || ''}`,
    `설정: ${payload.envPath || '—'}`,
    `로그: ${payload.logPath || '—'}`,
    '',
    payload.reason || '',
    '',
    ...(payload.output || []),
  ].join('\n');
}

document.getElementById('copy').addEventListener('click', async () => {
  await window.errorDialog.copy(fullText());
  const tag = document.getElementById('copied');
  tag.classList.add('on');
  setTimeout(() => tag.classList.remove('on'), 1600);
});
document.getElementById('openLog').addEventListener('click', () => window.errorDialog.openLog());
document.getElementById('openEnv').addEventListener('click', () => window.errorDialog.openEnv());
document.getElementById('quit').addEventListener('click', () => window.errorDialog.quit());

/* Ctrl+C 로도 전체가 복사되게 — 선택한 것이 없을 때만 */
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c' && !String(getSelection())) {
    window.errorDialog.copy(fullText());
  }
});
</script>
</body>
</html>
