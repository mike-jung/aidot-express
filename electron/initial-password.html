<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>관리자 로그인</title>
  <style>
    :root{color-scheme:light dark;--bg:#f5f7fb;--card:#fff;--ink:#202b3b;--dim:#637187;--line:#dce3ee;--accent:#2563eb;--success:#16834f;--error:#be3535}
    @media(prefers-color-scheme:dark){:root{--bg:#101722;--card:#1b2534;--ink:#edf2fa;--dim:#a4b2c7;--line:#354459;--accent:#4b85ff;--success:#66d5a2;--error:#ff9393}}
    *{box-sizing:border-box}body{margin:0;padding:30px;background:var(--bg);color:var(--ink);font:14px/1.6 "Segoe UI","Malgun Gothic",sans-serif}
    .eyebrow{margin:0 0 7px;font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--accent)}h1{margin:0;font-size:23px;letter-spacing:-.04em}
    .intro{margin:7px 0 20px;color:var(--dim)}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px 20px}
    .username{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}label,.label{font-size:12px;color:var(--dim)}#username{font-size:15px;user-select:text;overflow-wrap:anywhere}
    .password-row{display:flex;align-items:center;gap:10px;margin-top:5px}input{width:100%;min-width:0;border:0;background:transparent;color:var(--ink);font:600 19px/1.8 Consolas,monospace;outline-offset:3px}
    button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);padding:9px 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
    button:hover{filter:brightness(.97)}button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:disabled{opacity:.55;cursor:wait}svg{flex-shrink:0}#copy{padding:9px;width:38px;height:38px;flex-shrink:0}
    .actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:17px}.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
    #status{min-height:43px;margin:13px 0 0;color:var(--dim);font-size:12px;line-height:1.7}#status.success{color:var(--success)}#status.error{color:var(--error)}
  </style>
  <script src="initial-password-renderer.js" defer></script>
</head>
<body>
  <p class="eyebrow">AIDOT EXPRESS</p>
  <h1>관리자 로그인 정보</h1>
  <p class="intro">이 계정으로 콘솔에 로그인할 수 있습니다.</p>
  <section class="card" aria-label="관리자 계정">
    <div class="username"><span class="label">아이디</span><strong id="username">—</strong></div>
    <label for="password">비밀번호</label>
    <div class="password-row">
      <input id="password" type="text" readonly autocomplete="off" spellcheck="false" aria-label="관리자 비밀번호">
      <button id="copy" type="button" title="비밀번호 복사" aria-label="비밀번호 복사" disabled>
        <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>
      </button>
    </div>
  </section>
  <p id="status" role="status" aria-live="polite">로그인 정보를 불러오고 있습니다.</p>
  <div class="actions">
    <button id="generate" type="button" disabled><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 7v5h-5M4 17v-5h5M5.5 7a8 8 0 0 1 13.5-1L20 8M4 16l1 2a8 8 0 0 0 13.5-1"/></svg><span id="generate-label">임의 생성</span></button>
    <button id="continue" type="button" class="primary">로그인 화면으로</button>
  </div>
</body>
</html>
