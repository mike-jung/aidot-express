<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Aidot Express — 처음 설정</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#dfe3ea;--text:#1a1f2b;--dim:#6b7280;--accent:#185FA5;--bad:#c0392b;--ok:#1e8e5a}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1420;--card:#161c2a;--line:#262e40;--text:#e6e9f0;--dim:#9aa1b2}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.55 -apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;padding:22px 24px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--dim);font-size:12.5px;margin-bottom:18px}
.row{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;margin-bottom:9px}
label{color:var(--dim);font-size:12.5px}
input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--card);color:var(--text);font-size:13.5px;font-family:inherit}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.hint{grid-column:2;color:var(--dim);font-size:11.5px;margin:-4px 0 6px}
.actions{display:flex;gap:8px;margin-top:18px;align-items:center}
button{padding:9px 16px;border-radius:8px;border:1px solid var(--line);
  background:var(--card);color:var(--text);font-size:13.5px;cursor:pointer;font-family:inherit}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:disabled{opacity:.55;cursor:default}
#msg{margin-top:12px;font-size:12.5px;min-height:34px;white-space:pre-wrap}
#msg.bad{color:var(--bad)} #msg.ok{color:var(--ok)}
fieldset{border:1px solid var(--line);border-radius:10px;padding:14px 16px 8px;margin:0 0 14px}
legend{font-size:12px;color:var(--dim);padding:0 6px}
.spacer{flex:1}
</style>
</head>
<body>
<h1>처음 설정</h1>
<div class="sub">데이터베이스 연결 정보를 입력하세요. 나중에 설정 화면에서 바꿀 수 있습니다.</div>

<fieldset>
  <legend>데이터베이스</legend>
  <div class="row"><label for="type">종류</label>
    <select id="type">
      <option value="mariadb">MariaDB</option>
      <option value="mysql">MySQL</option>
      <option value="sqlite">SQLite (파일 하나 · 시험용)</option>
    </select></div>
  <div class="row db"><label for="host">주소</label><input id="host" value="127.0.0.1"></div>
  <div class="row db"><label for="port">포트</label><input id="port" value="3306"></div>
  <div class="row db"><label for="user">사용자</label><input id="user" value="root"></div>
  <div class="row db"><label for="password">비밀번호</label><input id="password" type="password"></div>
  <div class="row"><label for="database">스키마</label><input id="database" value="aidot_express"></div>
  <div class="hint db">없으면 기동할 때 만들어 봅니다. 계정에 CREATE 권한이 없으면 미리 만들어 두세요.</div>
  <div class="row sqlite" style="display:none"><label for="dbfile">파일</label><input id="dbfile" value="data/app.db"></div>
</fieldset>

<fieldset>
  <legend>서버</legend>
  <div class="row"><label for="srvport">포트</label><input id="srvport" value="7901"></div>
  <div class="hint">콘솔 주소가 됩니다 — http://localhost:<span id="portEcho">7901</span></div>
</fieldset>

<div class="actions">
  <button id="test">연결 시험</button>
  <div class="spacer"></div>
  <button id="later">나중에</button>
  <button id="save" class="primary">저장하고 시작</button>
</div>
<div id="msg"></div>

<script>
const $ = (id) => document.getElementById(id);
const msg = (text, kind) => { const m = $('msg'); m.textContent = text; m.className = kind || ''; };

function collect() {
  return {
    type: $('type').value,
    host: $('host').value.trim(),
    port: $('port').value.trim(),
    user: $('user').value.trim(),
    password: $('password').value,
    database: $('database').value.trim(),
    dbfile: $('dbfile').value.trim(),
    serverPort: $('srvport').value.trim(),
  };
}

/* SQLite 는 주소·계정이 필요 없다 — 보이면 오히려 헷갈린다 */
function syncType() {
  const isSqlite = $('type').value === 'sqlite';
  document.querySelectorAll('.db').forEach((e) => { e.style.display = isSqlite ? 'none' : ''; });
  document.querySelectorAll('.sqlite').forEach((e) => { e.style.display = isSqlite ? '' : 'none'; });
  $('port').value = $('type').value === 'mysql' ? '3306' : ($('port').value || '3306');
  $('test').disabled = isSqlite;
  msg('');
}
$('type').addEventListener('change', syncType);
$('srvport').addEventListener('input', () => { $('portEcho').textContent = $('srvport').value || '7901'; });

$('test').addEventListener('click', async () => {
  $('test').disabled = true; msg('연결해 보는 중…');
  const r = await window.setup.testDb(collect());
  $('test').disabled = false;
  if (r.ok) msg(`연결됐습니다.${r.version ? '\n서버: ' + r.version : ''}`, 'ok');
  else msg(`연결하지 못했습니다.\n${r.message}`, 'bad');
});

$('save').addEventListener('click', async () => {
  $('save').disabled = true; msg('저장하는 중…');
  const r = await window.setup.save(collect());
  if (!r.ok) { $('save').disabled = false; msg(r.message, 'bad'); }
});

$('later').addEventListener('click', () => window.setup.skip());

syncType();
</script>
</body>
</html>
