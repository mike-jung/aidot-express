<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    Aidot Express - 아이콘 디자인
    - 배경: 진한 남색 그라디언트 원형
    - 왼쪽: 넓은 번개 (AI 의 힘/속도 상징)
    - 오른쪽: AI 원형 배지 (AI dot 의 "dot")
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0c1a3e"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#fde047"/>
      <stop offset="50%"  stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 배경 원형 -->
  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="url(#bg)"/>

  <!-- 번개 (더 두껍게 — 왼쪽 영역) -->
  <g filter="url(#glow)">
    <path d="M 110 36
             L 56  140
             L 96  140
             L 78  220
             L 148 108
             L 106 108
             L 128 36
             Z"
          fill="url(#bolt)"
          stroke="#78350f"
          stroke-width="2"
          stroke-linejoin="round"/>
  </g>

  <!-- AI 원형 배지 (오른쪽 하단) -->
  <g>
    <!-- 흰색 외곽 -->
    <circle cx="182" cy="178" r="48" fill="#ffffff" stroke="#1e3a8a" stroke-width="4"/>
    <!-- AI 텍스트 -->
    <text x="182" y="196"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="44"
          font-weight="900"
          fill="#1e3a8a"
          text-anchor="middle"
          letter-spacing="-1">AI</text>
  </g>
</svg>
